services:
  whatsapp-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    deploy:
      resources:
        limits:
          memory: 1G  # Adjust memory allocation as needed
          cpus: '0.5'  # Adjust CPU allocation as needed
    ports:
      - "8080:8080"  # WhatsApp Bridge API port
    volumes:
      - ./store:/app/whatsapp-bridge/store  # Persistent storage for WhatsApp data
    environment:
      - TZ=UTC
      # Base URL used in download_url and webhook media_download_url. The container DNS
      # name is what the MCP server and other services on whatsapp_internal can reach;
      # localhost would only have worked inside the bridge container itself.
      - PUBLIC_BASE_URL=http://whatsapp-mcp-whatsapp-bridge-1:8080
      # Auto-download pool. Which chats are captured is not set here: a listener is a
      # webhook config with auto_download on, managed in the UI. AUTO_DOWNLOAD=off is a
      # kill switch for the pool that leaves every rule untouched.
      - AUTO_DOWNLOAD=on
      - AUTO_DOWNLOAD_WORKERS=2
    restart: unless-stopped
    # Shutdown drains the auto-download queue and closes the databases after whatsmeow
    # disconnects; the default 10s can cut that short (AUDIO_DOWNLOAD_PLAN.md §4.5).
    stop_grace_period: 30s
    healthcheck:
      # Probes the bridge HTTP port; a non-responsive process gets marked unhealthy
      test: ["CMD", "curl", "-f", "-s", "-X", "OPTIONS", "http://localhost:8080/api/send"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - whatsapp_internal

  whatsapp-mcp:
    build:
      context: .
      dockerfile: dockerfile
    deploy:
      resources:
        limits:
          memory: 2G  # Adjust memory allocation as needed
          cpus: '1'  # Adjust CPU allocation as needed
    ports:
      - "8081:8081"  # MCP server port with SSE
      - "8082:8082"  # Gradio UI port (only used when GRADIO=true)
    volumes:
      - ./store:/app/store  # Shared persistent storage for WhatsApp data
    environment:
      - TZ=UTC
      - DEBUG=true  # Enable debug mode for development
      - GRADIO=false  # Enable/disable Gradio UI (true/false)
      - BRIDGE_HOST=whatsapp-mcp-whatsapp-bridge-1  # Set bridge hostname for MCP server
    depends_on:
      - whatsapp-bridge
    restart: unless-stopped
    networks:
      - n8n_n8n_traefik_network
      - whatsapp_internal

  webhook-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    deploy:
      resources:
        limits:
          memory: 500M  # Lightweight nginx container
          cpus: '0.5'
    ports:
      - "8089:8080"  # Webhook UI port
    depends_on:
      - whatsapp-bridge
      - whatsapp-mcp
    restart: unless-stopped
    networks:
      - whatsapp_internal

networks:
  n8n_n8n_traefik_network:
    external: true
  whatsapp_internal:
    driver: bridge